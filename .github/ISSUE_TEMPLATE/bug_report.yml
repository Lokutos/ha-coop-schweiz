name: Bug report / Fehlermeldung
description: Something does not work / Etwas funktioniert nicht
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not post tokens, the address containing `code=`, user ids or list ids.**
        **Keine Tokens, keine Adresse mit `code=`, keine Benutzer- oder Listen-IDs einfügen.**
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version of this integration
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened? / Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines of `custom_components.coop_schweiz`
      render: text
